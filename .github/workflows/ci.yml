# Actividad 6 - GitHub Actions.
# Integración continua de la SPA con Playwright.

name: Playwright Tests CI

# Se ejecuta al abrir o actualizar un PR dirigido a main.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:

    # Nombre del check requerido por la protección de main.
    name: Run Playwright Tests

    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Imagen oficial de Playwright: ya incluye Chromium, Firefox y las
    # dependencias del sistema, por lo que no hace falta instalarlas con apt.
    # La versión debe coincidir con @playwright/test del package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:

      # 1. Descargar el código del repositorio.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Reutilizar las descargas de npm entre ejecuciones.
      - name: Cachear dependencias de npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node20-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-npm-

      # 4. Instalar las dependencias del proyecto.
      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests unitarios con cobertura
        run: npm run test:unit

      # 5. Ejecutar las pruebas de la Actividad 5.
      # HOME=/root: Firefox no arranca dentro del contenedor si $HOME
      # pertenece a otro usuario (workaround indicado por Playwright).
      - name: Ejecutar pruebas automatizadas
        run: npm test
        env:
          HOME: /root

      # 6. Publicar el reporte HTML como artifact.
      # También se intenta publicar si fallan los tests.
      - name: Publicar reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error